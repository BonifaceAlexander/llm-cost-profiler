[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-profiler"
version = "0.2.0"
description = "A tiny Python library for tracking LLM token usage, latency, and estimated cost - with per-agent-step cost attribution for LangGraph, a local dashboard, and litellm-backed pricing for hundreds of models."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Boniface Alexander", email = "you@example.com"}
]
license = {text = "MIT"}
keywords = ["llm","cost","profiler","openai","langchain","langgraph","litellm","dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
llm-cost-profiler = "llm_cost_profiler.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "twine"]
langgraph = ["langgraph", "langchain-core"]
litellm = ["litellm"]
dashboard = ["streamlit", "pandas"]
all = ["langgraph", "langchain-core", "litellm", "streamlit", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
